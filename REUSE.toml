version = 1
SPDX-PackageName = "Hermes Console"
SPDX-PackageSupplier = "Organization: XPeta Lab"
SPDX-PackageDownloadLocation = "https://github.com/xP3ta/hermes-console"

# Project-authored source, tests, documentation and build configuration.
# Central annotations keep binary/generated files auditable without adding
# thousands of format-specific header comments.
[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  ".gitleaks.toml",
  ".metadata",
  "*.md",
  "ASSET_PROVENANCE.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CODE_QUALITY_CHECKLIST.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "NOTICE",
  "README.md",
  "REUSE.toml",
  "SECURITY.md",
  "analysis_options.yaml",
  "l10n.yaml",
  "pubspec.lock",
  "pubspec.yaml",
  "android/.gitignore",
  "android/app/**",
  "android/build.gradle.kts",
  "android/gradle.properties",
  "android/settings.gradle.kts",
  "assets/branding/**",
  "assets/bridge/**",
  "assets/icon/**",
  "docs/**",
  "lib/**",
  "sbom/**",
  "scripts/**",
  "server-patches/**",
  "specs/**",
  "test/**",
  "test_tools/**",
  "tool/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"

# This notice contains both project-authored commentary and the preserved MIT
# attribution/text for the upstream fork.
[[annotations]]
path = "THIRD_PARTY_NOTICES.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (c) 2026 XPeta Lab",
  "Copyright (c) rusty4444 and hermes-android contributors",
]
SPDX-License-Identifier = "GPL-3.0-only AND MIT"

# Checked-in Gradle wrapper files are unmodified Apache-2.0 distribution files.
[[annotations]]
path = [
  "android/gradle/wrapper/**",
  "android/gradlew",
  "android/gradlew.bat",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2015 the original author or authors"
SPDX-License-Identifier = "Apache-2.0"

# Bundled font binaries retain the SIL Open Font License.
[[annotations]]
path = "assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) the respective font authors"
SPDX-License-Identifier = "OFL-1.1"

# Project-owned companion manifests and sprites were dedicated under CC0.
[[annotations]]
path = "assets/companions/**"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "CC0-1.0"

# Verbatim third-party evidence retains its original license, not tool/** GPL.
[[annotations]]
path = ["tool/sbom/license-evidence/cupertino_icons-1.0.9-LICENSE", "tool/sbom/license-evidence/whisper_ggml_plus-1.5.2-LICENSE", "tool/sbom/license-evidence/silero-vad-v6.2-LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) 2016 Vladimir Kharlampidi", "Copyright (c) 2022 Hrvoje Cukman", "Copyright (c) 2020-present Silero Team"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "tool/sbom/license-evidence/jni-1.0.0-LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2022, the Dart project authors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["tool/sbom/license-evidence/kotlinx-coroutines-1.10.2-LICENSE.txt", "tool/sbom/license-evidence/datastore-1.1.7-SharedCounter.android.kt", "tool/sbom/license-evidence/datastore-core-android-1.1.7.pom"]
precedence = "override"
SPDX-FileCopyrightText = ["Copyright 2000-2020 JetBrains s.r.o. and Kotlin Programming Language contributors", "Copyright 2022 The Android Open Source Project"]
SPDX-License-Identifier = "Apache-2.0"

# AC's owner decision, 2026-11-15.
[[annotations]]
path = ["assets/branding/daeroh_foreground.svg", "assets/branding/daeroh_launcher.svg", "assets/branding/daeroh_logo.png"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Daeroh / ac-slay3r"
SPDX-License-Identifier = "GPL-3.0-only"

# Upstream b06240f REUSE.toml and LICENSE; exact bytes in widget-origin.json.
[[annotations]]
path = ["android/app/src/main/res/drawable-nodpi/botw_*.png", "android/app/src/qa/res/drawable-nodpi/botw_*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 XPeta Lab"
SPDX-License-Identifier = "GPL-3.0-only"
